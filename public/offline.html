<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR music — You're Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      font-family: 'Inter', system-ui, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Ambient glows */
    .glow-1 {
      position: fixed; top: -200px; left: -200px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-2 {
      position: fixed; bottom: -200px; right: -200px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      border-radius: 2rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      max-width: 420px;
      width: calc(100% - 2rem);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 80px; height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(236,72,153,0.2));
      border: 1px solid rgba(124,58,237,0.3);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.3); }
      50% { box-shadow: 0 0 0 16px rgba(124,58,237,0); }
    }

    .icon-wrap svg { width: 36px; height: 36px; color: #a78bfa; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      background: linear-gradient(to right, #fff, rgba(255,255,255,0.7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    p {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .wave {
      display: flex; gap: 5px; justify-content: center;
      margin-bottom: 2rem;
    }
    .wave span {
      display: block; width: 4px; border-radius: 2px;
      background: linear-gradient(to top, #7c3aed, #ec4899);
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave span:nth-child(1) { height: 16px; animation-delay: 0s; }
    .wave span:nth-child(2) { height: 28px; animation-delay: 0.15s; }
    .wave span:nth-child(3) { height: 22px; animation-delay: 0.3s; }
    .wave span:nth-child(4) { height: 32px; animation-delay: 0.45s; }
    .wave span:nth-child(5) { height: 18px; animation-delay: 0.6s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
      </svg>
    </div>

    <div class="wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>You're Offline</h1>
    <p>MR music needs an internet connection to stream music. Check your connection and try again.</p>

    <button onclick="location.reload()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Try Again
    </button>
  </div>
</body>
</html>
